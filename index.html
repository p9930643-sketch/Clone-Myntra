<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping for Women, Men, Kids Fashion & Lifestyle - Myntra</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="utils.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <header class="container">
        <nav class="flex space-between">
            <div class="left flex items-center">
                <img src="https://cdn.iconscout.com/icon/free/png-256/free-myntra-icon-svg-download-png-2249158.png"
                 alt="Myntra Logo">
                 </div>
            <ul class="flex items-center justify-center uppercase semibold">
                <li> Men </li>
                <li> Women </li>
                <li> Kids </li>
                <li> Home </li>
                <li> Beauty </li>
                <li> Genz </li>

            </ul>
            <div class="right flex items-center">
                <input class ="search" placeholder="Search for products, brands and more" class="desktop-searchBar" value="" data-reactid="1039">
                <div class="profile mx-2">Profile</div>
                <div class="wishlist mx-2">Wishlist</div>

            </div>
        </nav>
    </header>
    <section class="container section1">
        <img class="couponImg" src="img 1.jpg" />

    <section class="container section2">
        <img class="homeImg" src="img 2.png" />
